name: CI

on:
  push:
    branches: [ "main", "submission" ]
  pull_request:
    branches: [ "main", "submission" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black
    - name: Run Ruff
      run: ruff check src/renderer tests
    - name: Run Black
      run: black --check src/renderer tests

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests with Coverage
      run: pytest --cov=src/renderer --cov-report=term-missing --cov-fail-under=70 tests/
