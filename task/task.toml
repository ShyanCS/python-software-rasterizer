[task]
name = "dynamo/software-renderer-repair"
description = "Repair a CPU software rasterizer with interacting mathematical defects so its output matches a reference renderer."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Games Puzzles and Interactive Simulation"
subcategory = "Rendering graphics"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["debug", "fix"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 6
difficulty_explanation = "The renderer contains three defects affecting different stages of the rendering pipeline. While each defect has its own observable symptoms, the resulting rendering errors compound, so correcting only part of the pipeline is insufficient to reproduce the reference output. Each defect produces output that is visually plausible on its own — a slightly cracked edge, a subtly warped texture, a marginally shifted occlusion boundary — so none of them announce themselves as obviously wrong, and casual visual inspection is not sufficient to detect or diagnose them. Because the defects sit in different, independent stages, fixing any subset still leaves the output numerically wrong on every scene, so an agent cannot stop after finding a single plausible-looking bug. Correctly diagnosing each defect requires understanding the underlying rendering mathematics (projective geometry, perspective-correct interpolation, and rasterization fill rules) well enough to identify which computed quantity is wrong and why, rather than pattern-matching against a known bug signature. The images have been artificially created but crafted to emulate realistic rendering scenarios involving overlap, camera angle, and textured surfaces — precisely the type of test case that a graphics programmer would run when verifying a rasterization engine. And while the class of bugs demonstrated here is an illustration of the types of bugs found in the wild during the process of engineering graphics rendering engines for games and CAD systems."
solution_explanation = The fix implements three independent fixes, each representing a different directional adjustment to the incorrect behavior: (1) Coverage – the bounding box calculation for triangles is presently doing floor rounding on the x/y coordinates of the top-right corner of the bounding box; it should be doing ceiling rounding so that any pixels on the border of the triangle are not accidentally excluded from being rasterized; (2) perspective interpolation – attribute interpolation (such as color, and texture coordinates) is using barycentric interpolation (affine interpolation) at present, while it should be using perspective correction, dividing the interpolated value by interpolated 1/w; affine blending only works for screen-aligned geometry and does not handle perspective properly; (3) Depth – and finally, the surprising one – the depth is presently calculated using perspective correction (it is being re-weighted with 1/w like all other attributes), while the right approach is to use a simple linear interpolation without perspective correction. This is the opposite direction of the fix from number (2), because the z-value in screen space is affine by definition of the projection transform, so applying perspective correction to it again results in incorrect behavior.
verification_explanation = "The verifier renders all four provided scenes independently using a known-correct copy of the rendering pipeline that is not present in the agent's environment, using the same scene and asset files available to the agent. It then compares the agent's output images against these reference renderings on a per-pixel, per-channel basis in normalized [0,1] space, using a small absolute tolerance sufficient to accommodate normal floating-point rounding differences. This tolerance is significantly smaller than the pixel deviations introduced by any of the intentional rendering defects, so an incomplete fix does not satisfy verification. The verifier also checks that all required output files exist, are valid decodable PNG images with finite pixel values, and have dimensions matching each scene's declared camera resolution before performing the pixel comparisons."

