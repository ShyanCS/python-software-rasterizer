[task]
name = "dynamo/software-renderer-repair"
description = "Repair a CPU software rasterizer with interacting mathematical defects so its output matches a reference renderer."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Games Puzzles and Interactive Simulation"
subcategory = "Rendering graphics"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["debug", "fix"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 6
difficulty_explanation = "The renderer contains three interacting producer/consumer contract mismatches across different stages of the rendering pipeline. Rather than placing incorrect mathematics directly inside the modules that perform interpolation, rasterization, or depth testing, the defects originate in upstream stages that produce values under subtly incorrect semantics while downstream consumers remain locally correct. This makes the rendered output visually plausible yet mathematically incorrect, because each downstream stage faithfully operates on invalid assumptions inherited from earlier pipeline stages. Correctly repairing the renderer therefore requires tracing data flow across multiple modules, understanding the semantic contracts that connect successive pipeline stages, and identifying where those contracts are violated rather than simply recognizing familiar rendering formulas. The scenes exercise different combinations of interpolation, coverage, and depth behavior, so repairing only one contract still leaves every rendered output numerically incorrect. The renderer, meshes, textures, and scenes used in this task are custom synthetic assets created specifically for benchmarking and contain intentionally injected defects rather than reproducing an existing renderer or open-source project. Similar debugging work is routinely performed by graphics software engineers developing game engines, visualization software, CAD applications, GPU validation tools, and rendering frameworks, where subtle producer/consumer contract violations across rendering pipeline stages can produce visually plausible yet mathematically incorrect results."
solution_explanation = "The renderer is repaired by restoring three producer-side contracts that downstream pipeline stages already assume. First, the vertex stage must preserve the original clip-space homogeneous W value rather than storing its reciprocal, allowing the existing perspective-correct interpolation implementation to operate correctly. Second, viewport mapping must generate screen-space X/Y coordinates using the sample-space convention expected by rasterization so that coverage calculations, edge tests, and barycentric evaluation remain mathematically consistent without modification. Third, viewport mapping must produce screen-space depth using the depth convention expected by the existing depth interpolation and comparison logic, restoring correct visibility ordering while leaving the depth-testing implementation itself unchanged. None of the downstream interpolation, rasterization, or depth algorithms require modification once these producer-side contracts are restored."
verification_explanation = "The verifier renders each provided scene using a known-correct implementation of the renderer and compares the resulting PNG images against the repaired renderer on a per-pixel, per-channel basis using a strict numerical tolerance. Because the three defects affect interpolation, coverage, and depth ordering through different producer-side contracts, correcting only a subset of them still produces deterministic but measurably incorrect images across the provided scenes. Verification additionally checks that every required output image exists, is a valid PNG with the expected dimensions, and contains finite pixel values before performing the numerical image comparison."

